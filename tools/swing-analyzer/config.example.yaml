# Golf Swing Analyzer config - example.
# Copy this to config.yaml and fill in the values for your setup.

paths:
  raw_video_dir: "C:/golf_swings/raw"
  annotated_video_dir: "C:/golf_swings/annotated"
  shot_data_dir: "C:/golf_swings/shot_data"
  analysis_dir: "C:/golf_swings/analysis"

matching:
  max_time_difference_seconds: 15
  wait_for_video_seconds: 25

retention:
  keep_recent_swings: 5

camera:
  angle: "down_the_line"
  # 1 = analyze every frame (smoothest body tracking, a bit slower).
  # 2 = every other frame (faster, slightly choppier).
  fps_sample_rate: 1

# Body tracking quality. If the skeleton stutters, prefer the "heavy" model
# and the One-Euro filter below. Heavy is slower per clip but far steadier,
# which matters now that the bay is well lit and clips process offline.
tracking:
  pose_model: "heavy"        # lite | full | heavy
  smoothing: "one_euro"      # one_euro | ema | none
  one_euro:
    min_cutoff: 1.2          # lower = smoother when still (kills jitter)
    beta: 0.02               # higher = snappier through fast downswing
    d_cutoff: 1.0
  smoothing_alpha: 0.35      # only used when smoothing: ema
  min_torso_visibility: 0.6
  detection_confidence: 0.6
  presence_confidence: 0.6
  tracking_confidence: 0.6

annotation:
  slow_motion_factor: 0.5
  # When true, the annotated MP4 is rendered as a side-by-side composite:
  # raw video on the left, AI body-mapping overlays on the right. The HA
  # "Last Swing" card just plays the one MP4 and you see both views in
  # the same player. Set false to render the analyzed view only.
  side_by_side: true
  overlays:
    advanced: true
    pelvis_depth_line: true
    spine_inclination_line: true
    head_box: true
    shoulder_plane_trace: true
    hand_path_trace: true

server:
  host: "0.0.0.0"
  port: 8765
  public_base_url: "http://CHANGE-ME:8765"

obs:
  enabled: true
  host: "127.0.0.1"
  port: 4455
  password: "CHANGE-ME"
  save_replay_on_shot: true

mqtt:
  enabled: true
  host: "CHANGE-ME"
  port: 1883
  username: "mqtt_swing"
  password: "CHANGE-ME"
  client_id: "golf_swing_analyzer"
  shot_topic: "golf/shot/raw"
  context_topic: "golf/context/current"
  enable_topic: "golf/swing/analyzer/enabled"
  result_prefix: "golf/swing/analysis"
  discovery_prefix: "homeassistant"
  device_name: "Golf Swing Analyzer"
  device_id: "golf_swing_analyzer"

llm:
  enabled: false
  endpoint: "http://localhost:11434/api/generate"
  model: "trinity"
  timeout_seconds: 60
  # Raise this if the coaching response still feels short. The full text is
  # published as MQTT attributes, so it is NOT limited by Home Assistant's
  # 255-character sensor-state cap (the dashboard cards read the full text).
  max_tokens: 900
  # Ollama vision models accept sampled video frames in the "images" field.
  # Use a vision-capable local model if you want the coach to compare raw
  # motion against the annotated marker overlay.
  send_video_frames: true
  max_visual_frames: 8
  visual_frame_max_width: 960
  visual_frame_jpeg_quality: 72

# Optional: copy each freshly-rendered annotated MP4 into one or more
# destinations. Typically used to publish clips through Home Assistant so
# the Last Swing dashboard card loads from a stable URL that works on the
# home network AND through Nabu Casa.
#
# Setup with HAOS:
#   1. Install the official "Samba share" add-on in HA and start it.
#   2. From the SIM PC, open Explorer and confirm \\homeassistant\config
#      and \\homeassistant\media are reachable.
#   3. Make the destination folders once:
#        \\homeassistant\config\www\golf_replays    (served at /local/...)
#        \\homeassistant\media\golf_replays         (HA Media Browser)
#
# When a destination defines public_url_prefix, that prefix replaces
# server.public_base_url for the published annotated_url. With "/local/..."
# the URL is served by HA itself, so it works locally and via Nabu Casa
# without any auth tokens.
#
# Older clips beyond keep_last are deleted in each destination right after
# a successful copy.
archive:
  enabled: false
  keep_last: 5
  filename_template: "swing_{timestamp}_{original}"
  destinations:
    # Served at /local/golf_replays/<file>. Use this for the HA dashboard.
    - path: '\\homeassistant\config\www\golf_replays'
      public_url_prefix: "/local/golf_replays"
    # Browsable in HA Media Browser; also reachable via Nabu Casa.
    - path: '\\homeassistant\media\golf_replays'

# Optional second camera mounted directly above the hitting area. Drop the
# top-down replay clips into raw_video_dir (any capture method works - a 2nd
# OBS instance with its own replay buffer, an ffmpeg recorder, etc.) and they
# will be matched to the same shot by timestamp and analyzed for ball + impact
# location. Leave disabled until the camera is mounted and the hitting zone is
# tuned; it never affects the down-the-line analysis.
top_down:
  enabled: false
  raw_video_dir: "C:/golf_swings/top_down"
  public_base_url: ""        # e.g. http://CHANGE-ME:8765 (defaults to server.public_base_url)
  angle: "top_down"
  impact:
    search_window_s: 0.6
    ball_min_radius_px: 6
    ball_max_radius_px: 40
    hitting_zone_x_pct: 0.5      # where the ball sits in the frame (0..1)
    hitting_zone_y_pct: 0.5
    hitting_zone_radius_pct: 0.35
    calibrated: false           # set true after calibrating a real-world reference
